[project]
name = "fast-mcp-template"
version = "0.1.0"
description = "Template for an MCP server. Rename everything here first."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "evolv Consulting" }]

# fastmcp 4.x is a prerelease line, so `fastmcp-slim` must be named
# explicitly or the resolve fails outright. Keep both lines together.
dependencies = [
  "fastmcp==4.0.0b4",
  "fastmcp-slim==4.0.0b4",   # transitive prerelease; must be named or resolution fails
  "pydantic-settings==2.15.0",
]

[project.scripts]
fast-mcp-template = "fast_mcp_template.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_mcp_template"]

[tool.uv]
prerelease = "explicit"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  # `docs/reviews/check-checkers-are-wired.py` PARSES the workflow YAML
  # rather than grepping it, because a grep counts a name in a COMMENT
  # as wired. Declared DIRECTLY: it is resolvable transitively today,
  # and relying on someone else's dependency is relying on a fact
  # nobody promised. types-PyYAML is what mypy needs for the import.
  "pyyaml>=6",
  "types-PyYAML>=6",
  "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# Advisory-ignore table, read by `scripts/check_advisories.py` (carried,
# DISABLED). Landed EMPTY. An entry is legal only for an advisory this
# code cannot reach, and only with an id, a date, a written
# unreachability reason, and an expiry no more than 30 days out.
# ---------------------------------------------------------------------------
[tool.fast-mcp-template.advisory-ignores]
entries = []

# ---------------------------------------------------------------------------
# ADOPTING AN EXISTING PROJECT: THIS BLOCK IS A REPLACEMENT, NOT A RENAME.
#
# The README's setup list tells you what to RENAME. It used to say nothing
# about what to KEEP, and that silence has a measured cost: the subject of
# the 2026-09-03 adoption is an async suite depending on
# `asyncio_mode = "auto"`. This block does not carry that key, the template
# ships no async tests, so nothing warns you - and all 26 of its tests
# errored AT COLLECTION. Two lines, silent if you miss them.
#
# AND THE MARKER LIST IS THE SHARPER HALF, found by re-running the
# adoption after the above was written. `addopts` below carries
# `--strict-markers`, so a marker this list does not name is not a warning -
# it is a COLLECTION ERROR. Replacing the host's `markers = [...]` with this
# one therefore breaks every test decorated with a marker the host declared
# and this file does not. Measured: the subject's suite died at collection
# with `'asyncio' not found in markers configuration option`, which is a
# different failure from the missing `asyncio_mode` and survives fixing it.
#
# THE THIRD CHANNEL IS THE DEPENDENCY GROUP, and it is invisible in the
# diff. This template declares dev tools in `[dependency-groups] dev`, which
# `uv sync` installs. A host declaring them in
# `[project.optional-dependencies] dev` is NOT installing them that way, so
# merging the two files can leave a plugin the tests import silently absent.
# That is how `pytest-asyncio` went missing on the subject even though the
# host's own pyproject still named it.
#
# BEFORE YOU PASTE THIS OVER YOUR OWN, keep:
#
#   - every key your project relies on in `[tool.pytest.ini_options]`
#     (`asyncio_mode`, and anything else it sets),
#   - every entry of your `markers = [...]`, MERGED with the two below
#     rather than replaced, because of `--strict-markers`,
#   - every `[tool.coverage.*]` and `[tool.ruff*]` key you rely on,
#   - and every dev dependency behind all of it, moved into
#     `[dependency-groups] dev` if that is not where your project keeps it.
#
# THE CHEAPEST CHECK THAT ALL THREE LANDED: `uv run --frozen pytest` and
# compare the PASSED count with what your suite gave before the merge. A
# collection error is not a smaller number, it is no number at all.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# --strict-markers is not housekeeping. If your test strategy excludes
# an arm by marker, a typo in the marker name selects nothing and the
# run goes green having tested less than it claimed.
addopts = ["-v", "--strict-markers", "--tb=short", "-ra"]

markers = [
  "credentialed: needs a real upstream credential. NEVER run in CI",
  "network: needs outbound network. Deselected from the default offline suite",
]

# ---------------------------------------------------------------------------
# Coverage. THERE IS NO `fail_under` HERE, AND ITS ABSENCE IS THE FIX.
#
# It was `fail_under = 80`, described in this comment as "a starting floor,
# not a measurement" - which was exactly the problem. A fixed floor in a
# template meant for EXISTING repositories is red by construction: measured
# on a real adoption, the subject stood at 7.45% and reaching 80 was ~200
# tests away. A gate that cannot go green gets switched off.
#
# THE THRESHOLD NOW LIVES IN `docs/coverage-baseline.txt`, measured on the
# day you adopt this template and enforced as a RATCHET by
# `docs/reviews/check-coverage-ratchet.py`. Still exactly ONE place, so the
# original rule below still holds: do not also pass `--cov-fail-under` on a
# command line. Two places to change a threshold is one place to forget.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/fast_mcp_template"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
show_missing = true

# ---------------------------------------------------------------------------
# LINE WIDTH IS A PER-PROJECT VALUE, and it is declared here rather than
# assumed. Change it freely - and when you do, edit row B1 of
# `docs/OBLIGATIONS.md` in the SAME COMMIT, because that row anchors on
# this literal. (That is not a hazard, it is the register working: on the
# 2026-09-03 adoption, changing this line to 100 turned check-obligations
# red naming B1 and B2 precisely. An unplanned positive control.)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

# MARKDOWN IS PROSE HERE, NOT SOURCE. Without this exclusion `ruff
# format` rewrites the Python blocks inside documents, which are quoted
# illustrations and not code that runs.
src = ["src", "tests"]
extend-exclude = ["**/*.md"]

# ---------------------------------------------------------------------------
# THE CARRIED MACHINERY IS LINTED BUT NOT FORMAT-CHECKED, and this is the
# one setting in the file that exists because of a measurement rather than
# a preference.
#
# `ruff format --check .` WAS UNSATISFIABLE AT EVERY WIDTH on any repo the
# template did not write. Measured on a real adoption, one variable, three
# points, same tree:
#
#     line-length   subject src   template machinery
#     88            21 files      0 files
#     100           0 files       23 files
#     120           -             27 files
#
# At 88 ruff wants to rewrap the HOST PROJECT's source. Above 88 it wants
# to rewrap the 44 checkers carried in here, because widening the limit
# tells `ruff format` to RE-JOIN lines that were split to fit 88. There is
# no width where both sides are green, and the count gets worse as the
# width grows - so this is a property of the mechanism, not of the number.
#
# WHY EXCLUDE RATHER THAN DISABLE THE GATE. Disabling `ruff format --check`
# outright - the other option on the table - would stop checking the host
# project's OWN code, which is the only code the gate is actually for. The
# machinery is the part that is not yours and that you did not choose a
# width for. So the exclusion is scoped to exactly that.
#
# WHY THIS IS SAFE FOR LINT, and it is worth being explicit because the
# two are not symmetric: `E501` (line too long) can only ever be SATISFIED
# by widening, never introduced by it, so the machinery stays fully LINTED
# at any width you pick. Only `ruff format`, which rewrites, is
# direction-sensitive. Nothing here is excluded from `ruff check`.
#
# IF YOU ADOPT THE MACHINERY AS YOUR OWN and want it formatted at your
# width, delete this block and run `ruff format` once. That is a decision
# with a diff, which is the point.
[tool.ruff.format]
exclude = ["docs/reviews/**", "scripts/**"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "W505",     # doc-line-too-long. Listed even though "W" covers it: W505
              # is INERT unless max-doc-length is set, so the pair stays
              # visible together.
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "D",        # pydocstyle
  "UP",       # pyupgrade
  "B",        # bugbear
  "S",        # bandit
  "ASYNC",    # async correctness
  "DTZ",      # naive datetimes
  "T20",      # no print statements in src
  "ANN",      # annotations required
]
ignore = ["D203", "D213"]   # mutually exclusive with D211/D212

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", "S603", "S607",  # asserts and subprocess are the point in a test
  "D103", "ANN",           # undocumented, unannotated tests are fine
  "N802",                  # test names may use CAPS for emphasis
]
# A checker script is a CLI: printing IS its interface, and its refusal
# message is the control being tested. T20 would forbid the thing the
# controls assert on.
"{scripts,docs/reviews}/**" = ["T201", "D103"]
"docs/reviews/**" = [
  "S101", "S603", "S607",  # asserts and subprocess are the point in a harness
  "ANN",                   # an unannotated probe helper is fine, as in tests/*
]
"scripts/**" = ["S101", "S603", "S607", "ANN"]

# ---------------------------------------------------------------------------
# FULL STRICTNESS STAYS ON, and the setting is NOT the gate on its own.
#
# mypy runs at full strictness and reports everything it finds. What makes
# the BUILD red is `docs/reviews/check-mypy-ratchet.py`: a NEW error
# against `docs/mypy-baseline.txt`, rather than the inherited ones. On a
# real adoption `--strict` from a standing start measured 158 errors in 20
# files - days of work presented as a config change - so strictness is
# preserved and only the cliff is removed.
#
# The literal setting below is anchored by OBLIGATIONS.md row B3, so this
# comment deliberately does NOT repeat it: a second occurrence makes the
# anchor ambiguous and the register refuses ambiguity rather than
# resolving it to the first hit. It refused this very comment once.
# Record the baseline on adoption:
#   python3 docs/reviews/check-mypy-ratchet.py --record
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# `docs/reviews` and `scripts` are IN the type gate on purpose. They are
# the wired checkers; leaving them out is how half of them went
# unchecked here for weeks.
files = ["src", "tests", "docs/reviews", "scripts"]
