name: CI

# THREE TIERS, and the tiering is the point.
#
#   Gate       every push and PR      1 job     target under 3 min
#   Merge      push to default branch + CodeQL  target under 6 min
#   Assurance  weekly cron, manual dispatch, or a push that touches code
#
# The tiering is visibility-agnostic so it works whether this repository is
# public (free minutes) or private (billed). On a private repo the split is
# load-bearing rather than merely tidy: the previous shape of this workflow
# ran 16 parallel jobs on every push, which bills 16 per-job roundings to buy
# latency no human experiences on a weekly harness.
#
# WHAT THE TEMPLATE ENABLES, and why it is a short list. The enabled
# gates are named by their steps below; `check-quickstart.py` is
# deliberately NOT among them (see UNWIRED_BY_DECISION for why).
# Everything else under `docs/reviews/` and `scripts/` is carried DISABLED,
# with the reason in `UNWIRED_BY_DECISION` inside
# `docs/reviews/check-checkers-are-wired.py`. Turn a gate on when this project
# has the artefact it checks, and only after measuring it green - a gate that
# lands red is one people learn to ignore.

on:
  push:
    # ================================================================
    # THE ONE LINE AN ADOPTER MUST EDIT, AND THE ONLY ONE THAT CANNOT
    # DERIVE ITSELF. `on:` is static YAML: GitHub evaluates no
    # expression here, so `github.event.repository.default_branch`
    # - which every other branch condition in this file now uses -
    # is unavailable at this key. It must be a literal list.
    #
    # WHY THAT IS DANGEROUS RATHER THAN MERELY ANNOYING. A repository
    # whose default branch is not in this list gets NO Gate run on a
    # push to its own trunk, and the tier does not go red: it is
    # simply ABSENT. Switched-off and broken render identically, which
    # is how 119 consecutive failures went unread on the project this
    # template came from. Measured on a real adoption: the subject's
    # default branch was `dev`, and Gate, CodeQL and actionlint were
    # all silently off.
    #
    # SO IT IS NOT LEFT TO A COMMENT. The Gate job runs
    # `check-default-branch-is-triggered.py`, which reads this list
    # and this repository's actual default branch and FAILS if the
    # default is missing. A comment is not a gate; that step is.
    # (It still fires on a repo whose push trigger is off, because
    # `pull_request` carries no branch filter and runs Gate anyway.)
    # ================================================================
    branches: [main, master, dev]
    # PATH FILTERS. A README-only change must not run the suite. Keep this
    # list in step with what the jobs below actually read.
    paths-ignore:
      - '**/*.md'
      - '!README.md'          # the adoption instructions live here
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# THE SINGLE HIGHEST-VALUE LINE IN THIS FILE (below). Without
# cancel-in-progress a busy branch bills every superseded run; one
# repository elsewhere consumed 83% of a month's bill this way. The
# TRUNK is exempt: a merge queue must not cancel the run that is
# establishing the trunk is green.
#
# THE TRUNK IS DERIVED, NOT NAMED. This read `'refs/heads/main'` and
# on a repo whose default branch is `dev` the trunk quietly lost its
# exemption. `github.event.repository.default_branch` is populated on
# `push` and `pull_request`, which is where a concurrency race can
# happen at all.
#
# RESIDUAL, STATED RATHER THAN ASSUMED: on an event whose payload
# carries no `repository` the expression compares against the string
# `refs/heads/`, matches nothing, and cancel-in-progress is TRUE. For
# `schedule` and `workflow_dispatch` that is harmless - those fire one
# run at a time - but it is the permissive direction and it is here in
# writing rather than discovered later.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # GATE - every push and every PR. Keep this under three minutes.
  # ---------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest   # NEVER macOS (bills 10x) or Windows (2x)
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is REQUIRED, not tidiness. check-design-freeze.py
          # resolves the SHA in DESIGN-FREEZE.txt, and a depth-1 checkout
          # cannot see it - the checker then reports a BROKEN INSTRUMENT
          # (exit 3), which is correct and unhelpful.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install from the frozen lock
        run: uv sync --frozen

      - name: No lock drift
        run: uv lock --check

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Types
        run: uv run --frozen mypy

      - name: Default suite, zero skips
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`, and `set -uo
          # pipefail` does NOT clear that. Under `-e` the ASSIGNMENT
          # `out=$(cmd)` is itself the failing command, so the shell dies
          # there and `rc=$?` never runs - every diagnostic branch below
          # would be unreachable. This `set +e` is what makes `rc` reachable.
          set +e
          out=$(uv run --frozen pytest --cov --cov-report=term-missing \
                --cov-report=json:coverage.json 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          # A SKIP IS A GREEN THAT TESTED NOTHING. Deselect an excluded arm
          # by marker; never `skipif`. The here-string belongs to the grep,
          # not after `then` - written the other way the grep reads STDIN,
          # finds nothing, and the guard never fires.
          if grep -qE '[0-9]+ skipped' <<< "$out"; then
            echo "::error::the suite skipped tests. A skip is a green that tested nothing."
            exit 1
          fi

      - name: Coverage has not fallen below its recorded baseline
        run: uv run --frozen python docs/reviews/check-coverage-ratchet.py

      - name: No mypy error that the baseline does not already record
        run: uv run --frozen python docs/reviews/check-mypy-ratchet.py

      - name: This repository's default branch is actually triggered
        env:
          # PASSED IN, not read inside the checker. The context is only
          # available to the workflow, and a checker that reached for it
          # would be unrunnable locally - so it takes the name and falls
          # back to `refs/remotes/origin/HEAD` off the clone.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --frozen python docs/reviews/check-default-branch-is-triggered.py

      - name: The design at its declared freeze is the design on the trunk
        run: uv run --frozen python docs/reviews/check-design-freeze.py

      - name: ADR numbers are unique and contiguous, and the index matches
        run: |
          set -uo pipefail
          # See the note in "Default suite" above: without this, `rc=$?` is
          # unreachable and the diagnostic below never prints.
          set +e
          out=$(uv run --frozen python docs/reviews/check-adr-numbers.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::two ADRs share a number, a number is missing, or the index disagrees"
            exit 1
          fi

      - name: Obligation anchors still resolve to their subjects
        run: |
          set -uo pipefail
          set +e
          out=$(uv run --frozen python docs/reviews/check-obligations.py 2>&1); rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::an obligation anchor no longer contains its subject"; exit 1
          fi
          # SELECTOR CONTROL. The script treats parsing zero rows as a
          # failure; assert the population is non-empty here too, rather
          # than trusting a green whose sample size nothing states.
          grep -qE 'Mappings: [1-9][0-9]*' <<< "$out" || {
            echo "::error::the checker parsed no mappings; its green means nothing"; exit 1; }

      - name: Every checker is wired, or says why it is not
        run: uv run --frozen python docs/reviews/check-checkers-are-wired.py

      - name: The wiring checker's own controls still fire
        run: uv run --frozen python docs/reviews/check-checkers-are-wired.py --self-test

      - name: The default-branch checker's own controls still fire
        run: bash docs/reviews/check-default-branch-controls.sh

      - name: The design-freeze checker's own controls still fire
        run: bash docs/reviews/check-design-freeze-controls.sh

      - name: Both ratchets' own controls still fire
        run: uv run --frozen bash docs/reviews/check-ratchet-controls.sh

      - name: scripts/lib survives a host project's stock .gitignore
        run: bash scripts/check-scripts-lib-survives-gitignore.sh

  # ---------------------------------------------------------------------
  # MERGE - push to the DEFAULT BRANCH only. Gate has already run on
  # the same commit.
  # ---------------------------------------------------------------------
  codeql:
    # THE TRUNK IS DERIVED, NOT NAMED - see the concurrency block above.
    # Written `'refs/heads/main'` this job never ran at all on a repo
    # whose default branch is `dev`, and a job that never runs renders
    # GREY, not red.
    if: >-
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  workflow-lint:
    # THE TRUNK IS DERIVED, NOT NAMED - see the concurrency block above.
    # Written `'refs/heads/main'` this job never ran at all on a repo
    # whose default branch is `dev`, and a job that never runs renders
    # GREY, not red.
    if: >-
      github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint the workflows
        run: |
          set -euo pipefail
          ver=1.7.7
          sha=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          url=https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz
          curl -fsSL "$url" -o /tmp/actionlint.tgz
          echo "${sha}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          SHELLCHECK_OPTS=--severity=warning /tmp/actionlint -no-color

  # ---------------------------------------------------------------------
  # SECURITY, free on a PRIVATE repository (EC-639, from fast-mcp-ado).
  # CodeQL needs paid GitHub Advanced Security on a private repo, so the
  # `codeql` job above only runs where it is free. These stand in for it:
  # pip-audit, the SBOM, TruffleHog, ruff's S rules and the strict type
  # gate. Pinned by commit SHA: this job reads the whole history.
  # ---------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # TruffleHog scans the full history

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # --no-install-project: the project is not on PyPI, and
      # `pip-audit --strict` turns that skip into a failure even on a
      # clean lock (measured on fast-mcp-ado, EC-634). Every later
      # `uv run` in this job is --no-sync.
      - name: Install the dependencies from the frozen lock (not the project)
        run: uv sync --frozen --no-install-project

      # pip-audit has no severity threshold: any advisory fails, so a
      # sanctioned response is a time-boxed single-advisory entry in
      # pyproject (`scripts/check_advisories.py`). NEVER
      # `uv run --with pip-audit` (unpinned, outside the lock).
      - name: Dependency audit
        run: |
          set -uo pipefail
          # GitHub runs every `run:` block as `bash -e {0}`; without
          # this `rc=$?` is unreachable.
          set +e
          flags=$(uv run --frozen --no-sync python scripts/check_advisories.py); rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the advisory table is invalid or an entry expired"; exit 1
          fi
          echo "ignore flags from the table: ${flags:-<none>}"
          # Unquoted ON PURPOSE: $flags is built by our own script from a
          # table of advisory ids.
          # shellcheck disable=SC2086
          uv run --frozen --no-sync pip-audit $flags --strict || {
            echo "::error::pip-audit found an advisory with no sanctioned ignore."
            echo "::error::Fix or remove the dependency, or add a time-boxed single-advisory entry"
            echo "::error::to [tool.fast-mcp-template.advisory-ignores]. NEVER a blanket ignore."
            exit 1; }

      # The SBOM comes from the FROZEN resolve (.venv): CycloneDX and SPDX.
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .venv
          format: cyclonedx-json
          artifact-name: sbom-ci.cdx.json
          output-file: sbom-ci.cdx.json

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .venv
          format: spdx-json
          artifact-name: sbom-ci.spdx.json
          output-file: sbom-ci.spdx.json

      # FULL history on every run, UNVERIFIED findings included. Not the
      # trufflehog action with `--only-verified`: that leaves a planted
      # fake AWS key GREEN (exit 0; without it, exit 183), and the action
      # scans a base..head range, which fails on a schedule event where
      # both are equal. Pinned by image digest.
      - name: Secret scan (TruffleHog 3.88.0, full history, unverified included)
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/repo:ro" \
            trufflesecurity/trufflehog:3.88.0@sha256:75c79b95b2d1f9b54c85b2cba14a7b9baa37bed0835485d6541de64f0fd667bb \
            git file:///repo --no-update --fail

  weekly-lock-audit:
    # Dependabot gets no runner on a private org repository, so this is
    # the scheduled re-resolve: every dependency in a scratch copy (the
    # committed lock is never touched), then audit the result.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Show what an upgrade would change, then audit the upgraded resolve
        run: |
          set -euo pipefail
          uv sync --frozen
          uv lock --upgrade --dry-run || true
          scratch="$(mktemp -d)"
          mkdir "${scratch}/w"
          git archive HEAD | tar -x -C "${scratch}/w"
          cd "${scratch}/w"
          uv lock --upgrade
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-upgraded.txt
          cd - >/dev/null
          uv run --frozen pip-audit --no-deps --disable-pip -r "${scratch}/w/requirements-upgraded.txt"

  # ---------------------------------------------------------------------
  # ASSURANCE - weekly, on demand, or when a push touches code.
  # ---------------------------------------------------------------------
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Classify the pushed paths by role
        id: classify
        run: |
          set -uo pipefail
          set +e
          changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null)
          if [ -z "$changed" ]; then
            # NO DIFF IS NOT "NO CODE". A first push, a force-push or a
            # shallow fetch all produce an empty list, and answering
            # `false` there would silently skip the tier.
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(src/|tests/|scripts/|docs/reviews/|pyproject.toml|uv.lock)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  harness-assurance:
    # `!= 'false'` IS NOT A STYLISTIC CHOICE, AND `== 'true'` IS A BUG.
    # `needs.<job>.outputs.<name>` is the EMPTY STRING when that job was
    # skipped or FAILED. Written `== 'true'` this condition then evaluates
    # false and the whole tier is skipped - and a skipped job renders GREY,
    # not red, so a broken classifier silently deletes the tier and nobody
    # sees a failure. Written `!= 'false'` the same breakage runs the tier,
    # which is the direction that fails CLOSED. `always()` is what lets this
    # job be reached at all when `changes` did not run (schedule/dispatch).
    if: >-
      always() && (
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && needs.changes.outputs.code != 'false')
      )
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install from the frozen lock
        run: uv sync --frozen

      # ONE SERIAL JOB, deliberately. Nobody waits on a weekly run, so
      # fanning it out buys latency no human experiences and pays 16 lane
      # setups and 16 per-job billing roundings for it.
      #
      # ADD YOUR MUTATION AND AMPUTATION HARNESSES HERE, each through
      # `scripts/ci-harness-gate.sh` so its verdict line, row floor and
      # exit code are read rather than assumed.
      - name: The tier is reachable, and says so
        run: |
          set -euo pipefail
          # A TIER NOBODY TRIGGERS IS A DELETED TIER. This step exists so
          # that the schedule/dispatch path is proved to fire on an empty
          # project, before there is a harness to run in it. DELETE IT once
          # a real harness step lives here - two of them is one that nobody
          # reads.
          echo "Assurance tier reached: event=${{ github.event_name }}"

      - name: The serial lane left no mutation in src or tests
        run: |
          set -euo pipefail
          # A KILLED HARNESS LEAVES ITS MUTATION IN THE TREE. Assert the
          # tree is clean rather than trusting each harness's own cleanup,
          # which does not run when the process is SIGKILLed.
          if [ -n "$(git status --porcelain -- src tests)" ]; then
            git status --porcelain -- src tests
            echo "::error::a harness left a mutation behind in src/ or tests/"
            exit 1
          fi
